name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  push:
    branches: ['test/**', 'fix/**', 'dev']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          if [ -f "$GITHUB_WORKSPACE/.github/ci-debug.jks" ]; then
            cp "$GITHUB_WORKSPACE/.github/ci-debug.jks" "$RUNNER_TEMP/ci-debug.jks"
          else
            keytool -genkeypair \
              -v \
              -keystore "$RUNNER_TEMP/ci-debug.jks" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Test updater and build fullDebug APK
        run: ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.updater.*' :app:assembleFullDebug --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-debug-apks
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create Test GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v1.1.0-test-dv-fix-v3" app/build/outputs/apk/full/debug/*.apk --clobber || \
          gh release create "v1.1.0-test-dv-fix-v3" app/build/outputs/apk/full/debug/*.apk \
            --title "Nuvio Test v3 - Scoped Transparent DecorView Dolby Vision Fix" \
            --notes "Test build with zero-touch themes.xml: dynamically scoped transparent DecorView during playback with restore on dispose, PlayerView background and shutter transparent, useArtwork disabled, RESIZE_MODE_FIT preserved. Package ID com.nuvio.tv.test, versionCode 1067."
